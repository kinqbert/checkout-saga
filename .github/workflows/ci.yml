# build, unit tests and the e2e suite on every push; on master, push the image and deploy it.
name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f infra/docker-compose.yaml --profile app up -d --build --wait
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: End-to-end suite (sagas, failure lab, timeouts, kill)
        run: node scripts/e2e.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yaml --profile app logs --tail 200

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: e2e
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # the server's CPU: linux/amd64 for CX/CPX/CCX, linux/arm64 for CAX.
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Ship the compose file and roll out this commit
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DIR: ${{ vars.DEPLOY_DIR || '/opt/checkout-saga' }}
          TAG: ${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          scp -P "$PORT" -i ~/.ssh/id_deploy infra/docker-compose.prod.yaml "$TARGET:$DIR/docker-compose.yaml"
          # secrets go over stdin (never visible to `ps`); GHCR login uses a throwaway Docker config.
          printf '%s\n%s\n' "$REGISTRY_TOKEN" "$POSTGRES_PASSWORD" | ssh -p "$PORT" -i ~/.ssh/id_deploy "$TARGET" "set -e; cd $DIR
            read -r token; read -r pgpass
            umask 077; printf 'POSTGRES_PASSWORD=%s\nTAG=%s\n' \"\$pgpass\" '$TAG' > .env
            export DOCKER_CONFIG=\$(mktemp -d); trap 'rm -rf \$DOCKER_CONFIG' EXIT
            echo \"\$token\" | docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null
            docker compose pull --quiet
            docker compose up -d --wait --remove-orphans
            docker image prune -f >/dev/null"
